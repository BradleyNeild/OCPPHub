{% extends 'base.html' %}

{% block title %}Delete Authorization{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-5">Delete Authorization</h1>
    <div class="alert alert-warning" role="alert">
        Are you sure you want to delete authorization {{ authorization.csms_name }} for {{ chargepoint.name }}?
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
