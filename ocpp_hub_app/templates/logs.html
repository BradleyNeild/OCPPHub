{% extends 'base.html' %}

{% block title %}System Logs{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-5">System Logs</h1>

    <!-- Filter Bar -->
    <div class="filters mt-3">
        <div class="row">
            <div class="col-md-12">
                <button class="btn btn-light w-100" type="button" id="filterBarButton" aria-expanded="false">
                    <span>Filter Events</span>
                    <span class="float-right">▼</span>
                </button>
                <div id="filterButtonsContainer" class="collapse mt-2">
                    <div class="d-flex flex-wrap">
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Boot Notification">Boot Notification</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Heartbeat">Heartbeat</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Meter Values">Meter Values</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Authorize">Authorize</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Start Transaction">Start Transaction</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Stop Transaction">Stop Transaction</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Status Notification">Status Notification</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Firmware Status Notification">Firmware Status Notification</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Diagnostics Status Notification">Diagnostics Status Notification</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Data Transfer">Data Transfer</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Call Result">Call Result</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Call Error">Call Error</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Information">Information</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Error">Error</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Connection">Connection</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="ConnectionError">ConnectionError</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="MessageSent">MessageSent</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="MessageError">MessageError</button>
                        <button type="button" class="btn btn-success event-type-button m-1 active" data-event-type="Authorization">Authorization</button>
                        <button type="button" class="btn btn-primary toggle-all-filters-button m-1" id="toggleAllFiltersButton">Toggle All Filters</button>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label for="startDate">Start Date:</label>
                            <input type="datetime-local" id="startDate" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label for="endDate">End Date:</label>
                            <input type="datetime-local" id="endDate" class="form-control">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-6">
                            <label for="fromEntity">From:</label>
                            <input type="text" id="fromEntity" class="form-control" placeholder="Entity name or type">
                        </div>
                        <div class="col-md-6">
                            <label for="toEntity">To:</label>
                            <input type="text" id="toEntity" class="form-control" placeholder="Entity name or type">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-12">
                            <label for="searchInput">Search:</label>
                            <input type="text" id="searchInput" class="form-control" placeholder="Search logs">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div class="row mt-3">
        <div class="col-md-2">
            <select id="logsPerPage" class="form-control">
                <option value="30">30 per page</option>
                <option value="50">50 per page</option>
                <option value="100">100 per page</option>
                <option value="200">200 per page</option>
            </select>
        </div>
        <div class="col-md-8 text-center">
            <span id="paginationInfo"></span>
        </div>
        <div class="col-md-2 text-right">
            <button id="previousPageButton" class="btn btn-secondary">Previous</button>
            <button id="nextPageButton" class="btn btn-secondary">Next</button>
        </div>
    </div>

    <!-- Error Message Display -->
    <div id="errorMessage" class="alert alert-danger mt-3" style="display: none;"></div>

    <!-- Logs Table -->
    <div class="table-responsive mt-3">
        <table class="table table-striped table-fixed">
            <thead>
                <tr>
                    <th style="width: 10%;">Timestamp</th>
                    <th style="width: 5%;">Level</th>
                    <th style="width: 10%;">Event Type</th>
                    <th style="width: 15%;">Action</th>
                    <th style="width: 15%;">From</th>
                    <th style="width: 15%;">To</th>
                    <th style="width: 30%;">Message</th>
                </tr>
            </thead>
            <tbody id="logTableBody">
                <!-- Logs will be dynamically loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="text-center mt-3" style="display: none;">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const filterBarButton = document.getElementById("filterBarButton");
    const filterButtonsContainer = document.getElementById("filterButtonsContainer");
    const eventTypeButtons = document.querySelectorAll(".event-type-button");
    const toggleAllFiltersButton = document.getElementById("toggleAllFiltersButton");
    const startDateInput = document.getElementById("startDate");
    const endDateInput = document.getElementById("endDate");
    const fromEntityInput = document.getElementById("fromEntity");
    const toEntityInput = document.getElementById("toEntity");
    const searchInput = document.getElementById("searchInput");
    const logsPerPageSelect = document.getElementById("logsPerPage");
    const previousPageButton = document.getElementById("previousPageButton");
    const nextPageButton = document.getElementById("nextPageButton");
    const logTableBody = document.getElementById("logTableBody");
    const paginationInfo = document.getElementById("paginationInfo");
    const errorMessageDiv = document.getElementById("errorMessage");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const selectedEventTypes = new Set();
    let currentPage = 1;
    let totalPages = 1;

    // Initialize all event types as selected
    eventTypeButtons.forEach(button => {
        selectedEventTypes.add(button.getAttribute("data-event-type"));
    });

    filterBarButton.addEventListener("click", function() {
        filterButtonsContainer.classList.toggle("collapse");
        filterBarButton.setAttribute("aria-expanded", filterButtonsContainer.classList.contains("collapse") ? "false" : "true");
        filterBarButton.querySelector("span.float-right").textContent = filterButtonsContainer.classList.contains("collapse") ? "▼" : "▲";
    });

    eventTypeButtons.forEach(button => {
        button.addEventListener("click", function() {
            const eventType = button.getAttribute("data-event-type");
            if (selectedEventTypes.has(eventType)) {
                selectedEventTypes.delete(eventType);
                button.classList.remove("btn-success");
                button.classList.add("btn-light");
            } else {
                selectedEventTypes.add(eventType);
                button.classList.remove("btn-light");
                button.classList.add("btn-success");
            }
            loadLogs();
        });
    });

    toggleAllFiltersButton.addEventListener("click", function() {
        const allActive = [...eventTypeButtons].every(button => button.classList.contains("btn-success"));
        eventTypeButtons.forEach(button => {
            const eventType = button.getAttribute("data-event-type");
            if (allActive) {
                selectedEventTypes.delete(eventType);
                button.classList.remove("btn-success");
                button.classList.add("btn-light");
            } else {
                selectedEventTypes.add(eventType);
                button.classList.remove("btn-light");
                button.classList.add("btn-success");
            }
        });
        loadLogs();
    });

    startDateInput.addEventListener("change", loadLogs);
    endDateInput.addEventListener("change", loadLogs);
    fromEntityInput.addEventListener("input", debounce(loadLogs, 300));
    toEntityInput.addEventListener("input", debounce(loadLogs, 300));
    searchInput.addEventListener("input", debounce(loadLogs, 300));
    logsPerPageSelect.addEventListener("change", function() {
        currentPage = 1;
        loadLogs();
    });
    previousPageButton.addEventListener("click", function() {
        if (currentPage > 1) {
            currentPage--;
            loadLogs();
        }
    });
    nextPageButton.addEventListener("click", function() {
        if (currentPage < totalPages) {
            currentPage++;
            loadLogs();
        }
    });

    function showError(message) {
        errorMessageDiv.textContent = message;
        errorMessageDiv.style.display = 'block';
    }

    function hideError() {
        errorMessageDiv.style.display = 'none';
    }

    function showLoading() {
        loadingSpinner.style.display = 'block';
    }

    function hideLoading() {
        loadingSpinner.style.display = 'none';
    }

    function loadLogs() {
        const logsPerPage = logsPerPageSelect.value;
        const startDate = startDateInput.value;
        const endDate = endDateInput.value;
        const fromEntity = fromEntityInput.value;
        const toEntity = toEntityInput.value;
        const searchQuery = searchInput.value.toLowerCase();

        const filters = {
            eventTypes: [...selectedEventTypes],
            startDate,
            endDate,
            fromEntity,
            toEntity,
            searchQuery,
            logsPerPage,
            page: currentPage
        };

        showLoading();
        hideError();

        fetch("{% url 'logs_data' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(filters)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            logTableBody.innerHTML = '';
            if (data.logs.length === 0) {
                logTableBody.innerHTML = '<tr><td colspan="7" class="text-center">No logs found</td></tr>';
            } else {
                data.logs.forEach(log => {
                    const row = document.createElement('tr');
                    row.className = getRowClass(log.level);
                    row.innerHTML = `
                        <td class="timestamp-cell">
                            <span>${new Date(log.timestamp).toLocaleDateString()}</span>
                            <span>${new Date(log.timestamp).toLocaleTimeString()}</span>
                        </td>
                        <td>${log.level}</td>
                        <td>${log.event_type}</td>
                        <td>${log.action || ''}</td>
                        <td>${formatEntity(log.from)}</td>
                        <td>${formatEntity(log.to)}</td>
                        <td>
                            <div class="log-message">${log.message}</div>
                            <button class="btn btn-sm btn-link toggle-details">Show Details</button>
                            <div class="log-details" style="display: none;">
                                <h6>Raw Message:</h6>
                                <pre>${log.raw_message || 'No raw message available'}</pre>
                            </div>
                        </td>
                    `;
                    logTableBody.appendChild(row);

                    // Add event listener for toggling details
                    const toggleButton = row.querySelector('.toggle-details');
                    const detailsDiv = row.querySelector('.log-details');
                    toggleButton.addEventListener('click', function() {
                        if (detailsDiv.style.display === 'none') {
                            detailsDiv.style.display = 'block';
                            toggleButton.textContent = 'Hide Details';
                        } else {
                            detailsDiv.style.display = 'none';
                            toggleButton.textContent = 'Show Details';
                        }
                    });
                });
            }

            totalPages = Math.ceil(data.totalLogs / logsPerPage);
            previousPageButton.disabled = currentPage === 1;
            nextPageButton.disabled = currentPage === totalPages;

            // Update pagination info
            paginationInfo.textContent = `Page ${currentPage} of ${totalPages} (Total logs: ${data.totalLogs})`;
            hideLoading();
        })
        .catch(error => {
            console.error('Error:', error);
            showError(`Error loading logs: ${error.message}`);
            hideLoading();
        });
    }

    function getRowClass(level) {
        switch (level) {
            case 'ERROR':
                return 'table-danger';
            case 'WARNING':
                return 'table-warning';
            default:
                return '';
        }
    }

    function formatEntity(entity) {
        if (!entity) return 'N/A';
        if (Array.isArray(entity)) {
            return entity.map(e => `${e.name} (${e.type})`).join(', ');
        }
        return `${entity.name} (${entity.type})`;
    }

    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Initial load
    loadLogs();
});
</script>
{% endblock %}
