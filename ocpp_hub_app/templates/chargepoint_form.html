{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit{% else %}Create{% endif %} Charge Point{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-5">{% if form.instance.pk %}Edit{% else %}Create{% endif %} Charge Point</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% if form.instance.pk %}Update{% else %}Create{% endif %}</button>
        <a href="{% url 'chargepoint_list' %}" class="btn btn-secondary">Back to Charge Points</a>
    </form>
</div>
{% endblock %}
