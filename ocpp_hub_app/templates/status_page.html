{% extends 'base.html' %}

{% block title %}Status Page{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-5">Status Page</h1>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Name</th>
                <th>Location</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for chargepoint in chargepoints %}
            <tr>
                <td>{{ chargepoint.name }}</td>
                <td>{{ chargepoint.location }}</td>
                <td>{{ chargepoint.status }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
