{% extends 'base.html' %}
{% load i18n %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mt-3">{% trans "Sign Up" %}</h1>
    <form method="post" action="{% url 'account_signup' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% trans "Sign Up" %}</button>
    </form>
    <p class="mt-3"><a href="{% url 'account_login' %}">{% trans "Already have an account? Login" %}</a></p>
</div>
{% endblock %}
