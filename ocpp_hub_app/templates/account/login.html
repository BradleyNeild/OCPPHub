{% extends 'base.html' %}
{% load i18n %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mt-3">{% trans "Login" %}</h1>
    <form method="post" action="{% url 'account_login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% trans "Login" %}</button>
    </form>
    <p class="mt-1"><a href="{% url 'account_signup' %}">{% trans "Don't have an account? Sign Up" %}</a></p>
</div>
{% endblock %}
