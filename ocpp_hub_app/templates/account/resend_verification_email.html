{% extends 'base.html' %}
{% load i18n %}

{% block title %}Resend Verification Email{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mt-3">{% trans "Resend Verification Email" %}</h1>
    <p>
        {% trans "Enter your email address below to receive a new verification email." %}
    </p>
    <form method="post" action="{% url 'resend_verification_email' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% trans "Resend Verification Email" %}</button>
    </form>
</div>
{% endblock %}
