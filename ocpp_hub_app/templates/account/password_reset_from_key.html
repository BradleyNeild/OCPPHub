{% extends 'base.html' %}
{% load i18n %}

{% block title %}Enter New Password{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mt-3">{% trans "Enter New Password" %}</h1>
    <form method="post" action="{% url 'account_reset_password_from_key' uidb36=uidb36 key=key %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{% trans "Change Password" %}</button>
    </form>
</div>
{% endblock %}
