{% extends 'base.html' %}

{% block title %}Generate Credentials{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mt-5">Generate Credentials for {{ chargepoint.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Generate</button>
        <a href="{% url 'chargepoint_list' %}" class="btn btn-secondary">Back to Charge Points</a>
    </form>
</div>
{% endblock %}
